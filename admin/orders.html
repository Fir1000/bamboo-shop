<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3a26">
  <title>คำสั่งซื้อ | หลังร้าน</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=4">
  <link rel="stylesheet" href="../css/admin.css?v=3">
</head>
<body class="admin" data-page="orders">

<div class="admin-loading" id="adminLoading">กำลังตรวจสอบสิทธิ์...</div>

<div id="adminShell" hidden>
  <aside class="admin-sidebar" id="adminSidebar" aria-label="เมนูหลังร้าน">
    <div class="side-brand"><img src="../assets/logo.svg" alt=""><span>หลังร้าน<br><small>วิสาหกิจชุมชนไม้ไผ่</small></span></div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="products.html">📦 จัดการสินค้า</a>
    <a href="categories.html">🏷️ หมวดหมู่</a>
    <a href="orders.html" class="active" aria-current="page">🛒 คำสั่งซื้อ</a>
    <a href="../index.html" target="_blank" rel="noopener">🏪 ดูหน้าร้าน</a>
    <div class="side-spacer"></div>
    <button type="button" class="logout" id="logoutBtn">🚪 ออกจากระบบ</button>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

  <header class="admin-topbar">
    <button type="button" class="admin-menu-btn" id="adminMenuBtn" aria-label="เปิดเมนู">☰</button>
    <a class="brand-mini" href="dashboard.html"><img src="../assets/logo.svg" alt="">หลังร้าน</a>
    <span class="admin-user" id="adminEmail"></span>
  </header>

  <main class="admin-main">

    <div class="admin-head">
      <div><h1>คำสั่งซื้อ</h1><p>เปลี่ยนสถานะได้จากช่อง “สถานะ” — ยกเลิกแล้วระบบคืนสต็อกให้อัตโนมัติ</p></div>
    </div>

    <div class="toolbar">
      <input type="search" class="search-input" id="orderSearch" placeholder="ค้นหาเลข Order / ชื่อลูกค้า / เบอร์โทร" aria-label="ค้นหาคำสั่งซื้อ">
      <select id="statusFilter" aria-label="กรองตามสถานะ"></select>
    </div>
    <p class="toolbar-meta" id="orderCount"></p>

    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>เลข Order</th><th>ชื่อลูกค้า</th><th>เบอร์โทร</th><th class="num">ยอดรวม</th><th>วันที่สั่ง</th><th>สถานะ</th><th></th></tr></thead>
        <tbody id="orderTable"><tr><td colspan="7" class="muted center">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>
    <div class="load-more-wrap"><button type="button" class="btn btn-ghost" id="loadMore" hidden>โหลดเพิ่มเติม</button></div>

    <dialog class="modal" id="orderDialog" aria-labelledby="orderDialogTitle">
      <div class="modal-head">
        <h2 id="orderDialogTitle" class="mono">คำสั่งซื้อ</h2>
        <button type="button" class="modal-close" id="closeOrderDialog" aria-label="ปิด">×</button>
      </div>
      <div class="modal-body" id="orderDetail"></div>
    </dialog>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js?v=7"></script>
<script src="../js/admin.js?v=3"></script>
</body>
</html>
